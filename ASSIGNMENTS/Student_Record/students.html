<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0"
    >

    <title>Student Records</title>


    <style>

        body {
            font-family: Arial, sans-serif;
            background-color: #f2f2f2;
            margin: 0;
            padding: 30px;
        }


        .container {
            max-width: 900px;
            margin: auto;
            background-color: white;
            padding: 30px;
            border-radius: 10px;
            box-shadow: 0 0 10px #ccc;
        }


        h1 {
            text-align: center;
            color: #333;
            margin-bottom: 25px;
        }


        table {
            width: 100%;
            border-collapse: collapse;
        }


        th,
        td {
            border: 1px solid #ccc;
            padding: 12px;
            text-align: center;
        }


        th {
            background-color: #007bff;
            color: white;
        }


        tr:nth-child(even) {
            background-color: #f5f5f5;
        }


        .back {
            display: block;
            width: fit-content;
            margin: 25px auto 0;
            padding: 10px 20px;
            background-color: #007bff;
            color: white;
            text-decoration: none;
            border-radius: 5px;
        }


        .back:hover {
            background-color: #0056b3;
        }

    </style>

</head>


<body>

    <div class="container">

        <h1>Student Records</h1>


        <table>

            <thead>

                <tr>

                    <th>S.No.</th>

                    <th>Student Name</th>

                    <th>Roll Number</th>

                    <th>Course</th>

                    <th>Email</th>

                </tr>

            </thead>


            <tbody>

                <!-- Student records will be inserted here -->

                {{STUDENTS}}

            </tbody>

        </table>


        <a href="/" class="back">
            Add Another Student
        </a>

    </div>

</body>

</html>
