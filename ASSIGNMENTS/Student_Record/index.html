<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">

    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Student Record Form</title>


    <style>

        body {
            font-family: Arial, sans-serif;
            background-color: #f2f2f2;
            margin: 0;
            padding: 0;
        }


        .container {
            width: 400px;
            margin: 60px auto;
            background-color: white;
            padding: 30px;
            border-radius: 10px;
            box-shadow: 0 0 10px #ccc;
        }


        h1 {
            text-align: center;
            color: #333;
            margin-bottom: 25px;
        }


        label {
            display: block;
            margin-top: 15px;
            font-weight: bold;
        }


        input {
            width: 100%;
            padding: 10px;
            margin-top: 5px;
            box-sizing: border-box;
            border: 1px solid #ccc;
            border-radius: 5px;
        }


        button {
            width: 100%;
            padding: 12px;
            margin-top: 25px;
            background-color: #007bff;
            color: white;
            border: none;
            border-radius: 5px;
            cursor: pointer;
            font-size: 16px;
        }


        button:hover {
            background-color: #0056b3;
        }


        .link {
            text-align: center;
            margin-top: 20px;
        }


        .link a {
            color: #007bff;
            text-decoration: none;
        }


        .link a:hover {
            text-decoration: underline;
        }

    </style>

</head>


<body>

    <div class="container">

        <h1>Student Record Form</h1>


        <form action="/add" method="POST">


            <label for="name">
                Student Name
            </label>

            <input
                type="text"
                id="name"
                name="name"
                placeholder="Enter student name"
                required
            >


            <label for="roll">
                Roll Number
            </label>

            <input
                type="text"
                id="roll"
                name="roll"
                placeholder="Enter roll number"
                required
            >


            <label for="course">
                Course
            </label>

            <input
                type="text"
                id="course"
                name="course"
                placeholder="Enter course"
                required
            >


            <label for="email">
                Email
            </label>

            <input
                type="email"
                id="email"
                name="email"
                placeholder="Enter email"
                required
            >


            <button type="submit">
                Add Student
            </button>

        </form>


        <div class="link">

            <a href="/students">
                View Student Records
            </a>

        </div>

    </div>

</body>

</html>
