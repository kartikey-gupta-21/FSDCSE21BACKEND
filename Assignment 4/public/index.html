<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Campus Help Desk</title>
  <link rel="stylesheet" href="style.css" />
</head>
<body>
  <header class="top">
    <h1>Campus Help Desk</h1>
    <p>Tell us what's broken, missing or confusing. We'll track it until it's fixed.</p>
  </header>

  <main>
    <section class="panel" aria-labelledby="form-title">
      <h2 id="form-title">New request</h2>
      <form id="request-form" novalidate>
        <input type="hidden" id="request-id" />

        <div class="row">
          <label>Student name
            <input type="text" id="name" required placeholder="e.g. Riya Sharma" />
          </label>
          <label>Email
            <input type="email" id="email" required placeholder="riya@college.edu" />
          </label>
        </div>

        <div class="row">
          <label>Category
            <select id="category" required>
              <option value="">Choose a category</option>
              <option>Hostel</option>
              <option>Library</option>
              <option>Academics</option>
              <option>IT / Wi-Fi</option>
              <option>Canteen</option>
              <option>Transport</option>
              <option>Other</option>
            </select>
          </label>
          <label>Priority
            <select id="priority" required>
              <option>Low</option>
              <option selected>Medium</option>
              <option>High</option>
            </select>
          </label>
        </div>

        <label>Problem description
          <textarea id="description" rows="4" required placeholder="What happened, where, and since when?"></textarea>
        </label>

        <p id="form-error" class="error" role="alert" hidden></p>

        <div class="actions">
          <button type="submit" id="submit-btn">Submit request</button>
          <button type="button" id="cancel-btn" class="ghost" hidden>Cancel edit</button>
        </div>
      </form>
    </section>

    <section aria-labelledby="list-title">
      <div class="list-head">
        <h2 id="list-title">All requests <span id="count"></span></h2>
      </div>
      <div id="list" class="list"></div>
    </section>
  </main>

  <script src="app.js"></script>
</body>
</html>
